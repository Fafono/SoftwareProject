<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Customer Registration</title>
    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
</head>
<body>
<div class="container-fluid">
    <div class="text-center"><h2 th:text="${pageTitle}">Customer Registration</h2></div>

    <form th:action="@{/customers/save}" th:object="${customer}" method="post" style="max-width: 500px; margin: 0 auto;" class="needs-validation" novalidate>
        <div class="border border-secondary rounded p-3">
            <div class="form-group row mb-3">
                <label class="col-sm-4 col-form-label">E-mail:</label>
                <div class="col-sm-8">
                    <input type="email" th:field="*{email}" class="form-control" required minlength="8" maxlength="50"/>
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></div>
                </div>
            </div>

            <div class="form-group row mb-3">
                <label class="col-sm-4 col-form-label">First Name:</label>
                <div class="col-sm-8">
                    <input type="text" th:field="*{firstName}" class="form-control" required minlength="2" maxlength="50"/>
                    <div th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="text-danger"></div>
                </div>
            </div>

            <div class="form-group row mb-3">
                <label class="col-sm-4 col-form-label">Last Name:</label>
                <div class="col-sm-8">
                    <input type="text" th:field="*{lastName}" class="form-control" required minlength="2" maxlength="50"/>
                    <div th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="text-danger"></div>
                </div>
            </div>

            <div class="form-group row mb-3">
                <label class="col-sm-4 col-form-label">Phone number:</label>
                <div class="col-sm-8">
                    <input type="text" th:field="*{contacts[0].number}" class="form-control" required minlength="10" maxlength="15"/>
                    <div th:if="${#fields.hasErrors('contacts[0].number')}" th:errors="*{contacts[0].number}" class="text-danger"></div>
                </div>
            </div>

            <div class="form-group row mb-3">
                <label class="col-sm-4 col-form-label">Street:</label>
                <div class="col-sm-8">
                    <input type="text" th:field="*{address.street}" class="form-control" required minlength="2" maxlength="50"/>
                    <div th:if="${#fields.hasErrors('address.street')}" th:errors="*{address.street}" class="text-danger"></div>
                </div>
            </div>

            <div class="form-group row mb-3">
                <label class="col-sm-4 col-form-label">City:</label>
                <div class="col-sm-8">
                    <input type="text" th:field="*{address.city}" class="form-control" required minlength="2" maxlength="50"/>
                    <div th:if="${#fields.hasErrors('address.city')}" th:errors="*{address.city}" class="text-danger"></div>
                </div>
            </div>

            <div class="form-group row mb-3">
                <label class="col-sm-4 col-form-label">Province:</label>
                <div class="col-sm-8">
                    <input type="text" th:field="*{address.province}" class="form-control" required minlength="2" maxlength="50"/>
                    <div th:if="${#fields.hasErrors('address.province')}" th:errors="*{address.province}" class="text-danger"></div>
                </div>
            </div>

            <div class="form-group row mb-3">
                <label class="col-sm-4 col-form-label">Zip Code:</label>
                <div class="col-sm-8">
                    <input type="text" th:field="*{address.zip}" class="form-control" required minlength="2" maxlength="10"/>
                    <div th:if="${#fields.hasErrors('address.zip')}" th:errors="*{address.zip}" class="text-danger"></div>
                </div>
            </div>

            <div class="form-group row mb-3">
                <label class="col-sm-4 col-form-label">Password:</label>
                <div class="col-sm-8">
                    <input type="password" th:field="*{password}" class="form-control" required minlength="8" maxlength="50"/>
                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger"></div>
                </div>
            </div>

            <div class="form-group row mb-3">
                <label class="col-sm-4 col-form-label">Confirm Password:</label>
                <div class="col-sm-8">
                    <input type="password" th:field="*{confirmPassword}" class="form-control" required minlength="8" maxlength="50"/>
                    <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-danger"></div>
                </div>
            </div>

            <div>
                <div class="text-center">
                    <button type="submit" class="btn btn-primary m-2">Save</button>
                    <button type="button" class="btn btn-secondary m-2" onclick="cancelForm()">Cancel</button>
                </div>
            </div>
        </div>
    </form>
</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
<script>
    function cancelForm() {
        window.location = "/customers";
    }
    // Bootstrap form validation
    (function () {
        'use strict';
        var forms = document.querySelectorAll('.needs-validation');
        Array.prototype.slice.call(forms).forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>
</body>
</html>
