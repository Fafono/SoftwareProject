<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Menu Page</title>
    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
</head>
<body>
<div class="container-fluid text-center">
    <h1>Menu</h1>
    <div class="m-2">
        <a class="h3" th:href="@{/menu/new}">Add New Item</a>
    </div>
    <div th:if="${#messages}">
        [[${message}]]
    </div>
    <div>
        <table class="table table-bordered">
            <thead class="thead-dark">
            <tr>
                <th>ID</th>
                <th>Item</th>
                <th>Price</th>
                <th>Description</th>
                <th>Category</th>
                <th>Date</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <th:block th:each="menu: ${listItems}">
                <tr>
                    <td>[[${menu.id}]]</td>
                    <td>[[${menu.item}]]</td>
                    <td>[[${menu.price}]]</td>
                    <td>[[${menu.description}]]</td>
                    <td>[[${menu.category}]]</td>
                    <td>[[${menu.created}]]</td>
                    <td>
                        <a class="h4 m-3" th:href="@{'/menu/edit/' + ${menu.id}}">Edit</a>
                        <a class="h4" th:href="@{'/menu/delete/' + ${menu.id}}">Delete</a>
                    </td>
                </tr>
            </th:block>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
