<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>[[${pageTitle}]]</title>
    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
</head>
<body>
<div class="container-fluid">
    <div class="text-center"><h2>[[${pageTitle}]]</h2></div>

    <form th:action="@{/customers/save}" method="post" th:object="${registerDTO}"
          style="max-width: 500px; margin: 0 auto;">
        <input type="hidden" th:name="${_csrf.parameterName}"
        th:value="${_csrf.token}">


        <div class="border border-secondary rounded p-3">
            <div class="form-group row">
                <label class="col-sm-4 col-form-label">E-mail:</label>
                <div class="col-sm-8">
                    <input type="email" th:field="*{registerDTO.email}" class="form-control" required minlength="8" maxlength="50"/>
                    <p th:if="*{#fields.hasErrors('email')}"
                       th:errorclass="text-danger"
                       th:errors="*{registerDTO.email}"></p>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-4 col-form-label">First Name:</label>
                <div class="col-sm-8">
                    <input type="text" th:field="*{registerDTO.firstName}" class="form-control" required minlength="2" maxlength="50"/>
                    <p th:if="*{#fields.hasErrors('firstName')}"
                       th:errorclass="text-danger"
                       th:errors="*{registerDTO.firstName}"></p>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-4 col-form-label">Last Name:</label>
                <div class="col-sm-8">
                    <input type="text" th:field="*{registerDTO.lastName}" class="form-control" required minlength="2" maxlength="50"/>
                    <p th:if="*{#fields.hasErrors('lastName')}"
                       th:errorclass="text-danger"
                       th:errors="*{registerDTO.lastName}"></p>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-4 col-form-label">Phone number:</label>
                <div class="col-sm-8">
                    <input type="text" th:field="*{registerDTO.contacts}" class="form-control" required minlength="2" maxlength="50"/>
                    <p th:if="*{#fields.hasErrors('contacts')}"
                       th:errorclass="text-danger"
                       th:errors="*{registerDTO.contacts}"></p>
                </div>

            </div>
            <div class="form-group row">
                <label class="col-sm-4 col-form-label">Street:</label>
                <div class="col-sm-8">
                    <input type="text" th:field="*{registerDTO.address.street}" class="form-control" required minlength="2" maxlength="50"/>
                    <p th:if="*{#fields.hasErrors('address')}"
                       th:errorclass="text-danger"
                       th:errors="*{registerDTO.address.street}"></p>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-4 col-form-label">City:</label>
                <div class="col-sm-8">
                    <input type="text" th:field="*{registerDTO.address.city}" class="form-control" required minlength="2" maxlength="50"/>
                    <p th:if="*{#fields.hasErrors('adrress')}"
                       th:errorclass="text-danger"
                       th:errors="*{registerDTO.address.city}"></p>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-4 col-form-label">Province:</label>
                <div class="col-sm-8">
                    <input type="text" th:field="*{registerDTO.address.province}" class="form-control" required minlength="2" maxlength="50"/>
                    <p th:if="*{#fields.hasErrors('adrress')}"
                       th:errorclass="text-danger"
                       th:errors="*{registerDTO.address.province}"></p>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-4 col-form-label">Code:</label>
                <div class="col-sm-8">
                    <input type="text" th:field="*{registerDTO.address.zip}" class="form-control" required minlength="2" maxlength="50"/>
                    <p th:if="*{#fields.hasErrors('address')}"
                       th:errorclass="text-danger"
                       th:errors="*{registerDTO.address.zip}"></p>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-4 col-form-label">Password:</label>
                <div class="col-sm-8">
                    <input type="password" th:field="*{registerDTO.password}" class="form-control" required minlength="5" maxlength="50"/>
                    <p th:if="*{#fields.hasErrors('password')}"
                       th:errorclass="text-danger"
                       th:errors="*{registerDTO.password}"></p>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-4 col-form-label">Delivery:</label>
                <div class="col-sm-8">
                    <input type="checkbox" th:field="*{registerDTO.delivery}" class="form-control" required minlength="2" maxlength="50"/>
                    <p th:if="*{#fields.hasErrors('delivery')}"
                       th:errorclass="text-danger"
                       th:errors="*{registerDTO.delivery}"></p>
                </div>
            </div>

            <div class="text-center">
                <button type="submit" class="btn-primary m-2">Save</button>
                <button type="button" class="border-secondary" onclick="cancelForm()">Cancel</button>
            </div>
        </div>
    </form>
</div>
<script type="text/javascript">
    function cancelForm() {
        window.location = "[[@{/customers}]]";
    }
</script>
</body>
</html>
